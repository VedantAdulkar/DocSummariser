<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocQ | Home</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
    <script src="https://kit.fontawesome.com/9b7a42a725.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <a href="/" class="logo">
            <h1>Doc<i class="fa-solid fa-magnifying-glass-chart"></i></h1>
        </a>
        <nav>
            <a href="/image">Image</a>
            <a href="/pdf">PDF</a>
            <a href="/video">Video</a>
        </nav>
    </header>

    <main class="main-content">
        <section class="hero">
            <h2>Let's interact with your files...!!</h2>
            <p>Choose a summarizer tool below to get started</p>
        </section>

        <div class="options-grid">
            <a href="/image" class="glass-panel option-card animate__fadeInUp" style="animation-delay: 0.2s;">
                <i class="fas fa-image"></i>
                <h3>Image Summarizer</h3>
                <p>Extract text and ask questions from images.</p>
            </a>
            
            <a href="/pdf" class="glass-panel option-card animate__fadeInUp" style="animation-delay: 0.4s;">
                <i class="fas fa-file-pdf"></i>
                <h3>PDF Summarizer</h3>
                <p>Analyze and query your PDF documents.</p>
            </a>
            
            <a href="/video" class="glass-panel option-card animate__fadeInUp" style="animation-delay: 0.6s;">
                <i class="fas fa-video"></i>
                <h3>Video Summarizer</h3>
                <p>Get summaries from YouTube or local videos.</p>
            </a>
        </div>
    </main>
</body>
</html>
