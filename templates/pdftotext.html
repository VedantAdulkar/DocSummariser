<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocQ | PDF Summarizer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.9.359/pdf.min.js"></script>
    <script src="https://kit.fontawesome.com/9b7a42a725.js" crossorigin="anonymous"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const fileInput = document.getElementById('fileElem');
            const summarizeButton = document.getElementById('summarize');
            const askButton = document.getElementById('askButton');
            const questionInput = document.getElementById('questionInput');
            const pdfContent = document.getElementById('pdf-content');
            const statusDiv = document.getElementById('status');
            const answerDiv = document.getElementById('answer');
            const dropArea = document.getElementById('drop-area');

            fileInput.addEventListener('change', function(event) {
                const file = event.target.files[0];
                if (file) {
                    const fileReader = new FileReader();

                    fileReader.onload = function(event) {
                        const loadingTask = pdfjsLib.getDocument({ data: event.target.result });

                        loadingTask.promise.then(pdf => {
                            pdfContent.innerHTML = ''; // Clear previous content

                            for (let pageNum = 1; pageNum <= Math.min(pdf.numPages, 3); pageNum++) { // Preview first 3 pages to save DOM
                                pdf.getPage(pageNum).then(page => {
                                    const scale = 1.0; 
                                    const viewport = page.getViewport({ scale });

                                    const canvas = document.createElement('canvas');
                                    canvas.style.display = 'block';
                                    canvas.style.marginBottom = '10px';
                                    canvas.style.width = '100%';
                                    
                                    const context = canvas.getContext('2d');
                                    canvas.height = viewport.height;
                                    canvas.width = viewport.width;

                                    pdfContent.appendChild(canvas);

                                    const renderContext = {
                                        canvasContext: context,
                                        viewport: viewport
                                    };
                                    page.render(renderContext);
                                });
                            }
                            if(pdf.numPages > 3) {
                                const morePages = document.createElement('p');
                                morePages.style.textAlign = 'center';
                                morePages.textContent = `... and ${pdf.numPages - 3} more pages`;
                                pdfContent.appendChild(morePages);
                            }

                            summarizeButton.disabled = false;
                            statusDiv.textContent = '';
                        }, reason => {
                            console.error(reason);
                        });
                    };

                    fileReader.readAsArrayBuffer(file);
                }
            });

            summarizeButton.addEventListener('click', function() {
                const file = fileInput.files[0];
                const formData = new FormData();
                formData.append('file', file);

                statusDiv.className = 'status-msg';
                statusDiv.textContent = 'Extracting text...';
                summarizeButton.disabled = true;

                fetch('/extract', {
                    method: 'POST',
                    body: formData,
                })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        statusDiv.textContent = 'Error: ' + data.error;
                        statusDiv.classList.add('status-error');
                        summarizeButton.disabled = false;
                    } else {
                        statusDiv.textContent = 'File processed successfully';
                        statusDiv.classList.add('status-success');
                        askButton.disabled = false;
                        questionInput.disabled = false;
                    }
                })
                .catch(error => {
                    statusDiv.textContent = 'Error: ' + error.message;
                    statusDiv.classList.add('status-error');
                    summarizeButton.disabled = false;
                });
            });

            askButton.addEventListener('click', function() {
                const question = questionInput.value;
                if(!question) {
                    alert("Please enter a question.");
                    return;
                }

                answerDiv.style.display = 'block';
                answerDiv.textContent = 'Generating answer...';

                fetch('/ask_question', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ question })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        answerDiv.innerHTML = `<strong class="status-error">Error:</strong> ${data.error}`;
                    } else {
                        answerDiv.innerHTML = `<strong>Answer:</strong><br>${data.answer}`;
                    }
                })
                .catch(error => {
                    answerDiv.innerHTML = `<strong class="status-error">Error:</strong> ${error.message}`;
                });
            });

            // Drag-and-drop functionality
            dropArea.addEventListener('dragover', function(event) {
                event.preventDefault();
                dropArea.classList.add('highlight');
            });

            dropArea.addEventListener('dragleave', function() {
                dropArea.classList.remove('highlight');
            });

            dropArea.addEventListener('drop', function(event) {
                event.preventDefault();
                dropArea.classList.remove('highlight');
                const files = event.dataTransfer.files;
                if(files.length > 0) {
                    fileInput.files = files;
                    fileInput.dispatchEvent(new Event('change'));
                }
            });
        });
    </script>
</head>
<body>
    <header>
        <a href="/" class="logo">
            <h1>Doc<i class="fa-solid fa-magnifying-glass-chart"></i></h1>
        </a>
        <nav>
            <a href="/image">Image</a>
            <a href="/pdf" class="active">PDF</a>
            <a href="/video">Video</a>
        </nav>
    </header>

    <main class="main-content">
        <div class="glass-panel tool-container">
            <div class="tool-header">
                <h2>PDF Summarizer</h2>
                <p>Upload a PDF document to extract text and ask questions about its content.</p>
            </div>
            
            <div id="drop-area" class="drop-zone">
                <i class="fas fa-file-pdf" style="font-size: 3rem; color: var(--accent); margin-bottom: 15px;"></i>
                <p>Drag & Drop your PDF here or</p>
                <input type="file" id="fileElem" accept="application/pdf">
                <label class="btn" for="fileElem">Choose File</label>
            </div>
            
            <div id="preview" class="preview-box">
                <div id="pdf-content" style="text-align: center; color: var(--text-muted);">PDF preview will appear here...</div>
            </div>
            
            <button id="summarize" class="btn btn-primary" disabled>Extract Text</button>
            <div id="status" class="status-msg"></div>

            <div class="input-group">
                <input type="text" id="questionInput" class="input-field" placeholder="Ask a question about the document..." disabled>
                <button id="askButton" class="btn" disabled>Ask Question</button>
            </div>
            
            <div id="answer" class="answer-box"></div>
        </div>
    </main>
</body>
</html>
