<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocQ | Video Summarizer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
    <script src="https://kit.fontawesome.com/9b7a42a725.js" crossorigin="anonymous"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Tab switching logic
            document.querySelectorAll('.tab-btn').forEach(button => {
                button.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');

                    document.querySelectorAll('.tab-content').forEach(section => section.classList.remove('active'));
                    document.getElementById(button.dataset.tab).classList.add('active');
                });
            });

            // Drag and drop for local video upload
            const dropArea = document.getElementById('drop-area');
            const fileInput = document.getElementById('file-upload');
            const fileLabel = document.getElementById('file-label-text');

            if (dropArea) {
                dropArea.addEventListener('dragover', function(event) {
                    event.preventDefault();
                    dropArea.classList.add('highlight');
                });

                dropArea.addEventListener('dragleave', function() {
                    dropArea.classList.remove('highlight');
                });

                dropArea.addEventListener('drop', function(event) {
                    event.preventDefault();
                    dropArea.classList.remove('highlight');
                    const files = event.dataTransfer.files;
                    if(files.length > 0) {
                        fileInput.files = files;
                        fileLabel.textContent = files[0].name;
                    }
                });

                fileInput.addEventListener('change', function() {
                    if (this.files && this.files.length > 0) {
                        fileLabel.textContent = this.files[0].name;
                    }
                });
            }
        });

        function updateThumbnail() {
            const videoUrl = document.getElementById('video-url').value;
            const thumbnailDiv = document.getElementById('thumbnail');
            const thumbnailImg = document.getElementById('thumbnail-img');
            
            if (videoUrl && videoUrl.includes("v=")) {
                const videoId = videoUrl.split("v=")[1].split("&")[0];
                thumbnailImg.src = `https://img.youtube.com/vi/${videoId}/0.jpg`;
                thumbnailDiv.style.display = 'block';
            } else {
                thumbnailDiv.style.display = 'none';
            }
        }

        function summarizeVideo(type) {
            const loader = document.getElementById('loader');
            const statusDiv = document.getElementById('status');
            const askGroup = document.getElementById('ask-group');
            
            loader.style.display = 'block';
            statusDiv.className = 'status-msg';
            statusDiv.textContent = 'Processing video... this may take a while.';
            statusDiv.style.display = 'block';

            let formData = new FormData();
            formData.append('type', type);
            if (type === 'youtube') {
                const videoUrl = document.getElementById('video-url').value;
                if(!videoUrl) {
                    alert('Please enter a YouTube URL');
                    loader.style.display = 'none';
                    statusDiv.style.display = 'none';
                    return;
                }
                formData.append('youtube_url', videoUrl);
            } else if (type === 'import') {
                const fileInput = document.getElementById('file-upload');
                if(!fileInput.files || fileInput.files.length === 0) {
                    alert('Please choose a file');
                    loader.style.display = 'none';
                    statusDiv.style.display = 'none';
                    return;
                }
                formData.append('file', fileInput.files[0]);
            }

            fetch('/summarize', {
                method: 'POST',
                body: formData,
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    statusDiv.innerHTML = `<span class="status-error">Error: ${data.error}</span>`;
                } else {
                    statusDiv.innerHTML = `<strong>Summary:</strong><br><br>${data.summary.replace(/\\n/g, '<br>')}`;
                    statusDiv.classList.add('answer-box');
                    statusDiv.style.display = 'block';
                    
                    if(data.transcript) {
                        statusDiv.setAttribute('data-transcript', data.transcript);
                        askGroup.style.display = 'flex'; // Show question area
                    }
                }
            })
            .catch(error => {
                statusDiv.innerHTML = `<span class="status-error">Error: ${error.message}</span>`;
            })
            .finally(() => {
                loader.style.display = 'none';
            });
        }

        function askQuestion() {
            const questionInput = document.getElementById('question-input');
            const question = questionInput.value;
            const transcript = document.querySelector('#status').getAttribute('data-transcript');
            const answerDisplay = document.getElementById('answer-display');

            if (!question || !transcript) {
                alert('Please ensure you have a question and a processed transcript available.');
                return;
            }

            answerDisplay.style.display = 'block';
            answerDisplay.textContent = 'Generating answer...';

            fetch('/ask_question', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ transcript: transcript, question: question }),
            })
            .then(response => response.json())
            .then(data => {
                if (data.answer) {
                    answerDisplay.innerHTML = `<strong>Answer:</strong><br>${data.answer.replace(/\\n/g, '<br>')}`;
                } else if (data.error) {
                    answerDisplay.innerHTML = `<strong class="status-error">Error:</strong> ${data.error}`;
                } else {
                    answerDisplay.innerHTML = 'No answer found.';
                }
            })
            .catch(error => {
                answerDisplay.innerHTML = `<strong class="status-error">Error:</strong> ${error}`;
            });
        }
    </script>
</head>
<body>
    <header>
        <a href="/" class="logo">
            <h1>Doc<i class="fa-solid fa-magnifying-glass-chart"></i></h1>
        </a>
        <nav>
            <a href="/image">Image</a>
            <a href="/pdf">PDF</a>
            <a href="/video" class="active">Video</a>
        </nav>
    </header>

    <main class="main-content">
        <div class="glass-panel tool-container">
            <div class="tool-header">
                <h2>Video Summarizer</h2>
                <p>Summarize YouTube videos or local video files and ask questions.</p>
            </div>
            
            <div class="tabs">
                <button class="tab-btn active" data-tab="tab-youtube">YouTube Video</button>
                <button class="tab-btn" data-tab="tab-import">Local Video</button>
            </div>

            <div id="tab-youtube" class="tab-content active">
                <div class="input-group" style="margin-bottom: 20px;">
                    <input type="text" id="video-url" class="input-field" placeholder="Enter YouTube video URL here (e.g. https://youtube.com/watch?v=...)" oninput="updateThumbnail()">
                </div>
                
                <div id="thumbnail" class="preview-box" style="display: none; text-align: center;">
                    <img id="thumbnail-img" src="" alt="YouTube Thumbnail">
                </div>
                
                <button class="btn btn-primary" onclick="summarizeVideo('youtube')">Summarize Video</button>
            </div>

            <div id="tab-import" class="tab-content">
                <div id="drop-area" class="drop-zone">
                    <i class="fas fa-file-video" style="font-size: 3rem; color: var(--accent); margin-bottom: 15px;"></i>
                    <p id="file-label-text">Drag & Drop your Video here or</p>
                    <input type="file" id="file-upload" accept="video/*">
                    <label class="btn" for="file-upload">Choose File</label>
                </div>
                <button class="btn btn-primary" onclick="summarizeVideo('import')">Summarize Video</button>
            </div>

            <div id="loader" class="loader"></div>
            <div id="status" class="status-msg" style="display: none;"></div>

            <div id="ask-group" class="input-group" style="display: none;">
                <input type="text" id="question-input" class="input-field" placeholder="Ask a question about the video...">
                <button id="ask-button" class="btn" onclick="askQuestion()">Ask</button>
            </div>
            
            <div id="answer-display" class="answer-box"></div>
        </div>
    </main>
</body>
</html>
